name: agora-backtest-integration

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agora_test
      POSTGRES_USER: agora_test
      POSTGRES_PASSWORD: agora_test_password
    volumes: ["./db/init:/docker-entrypoint-initdb.d:ro"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agora_test -d agora_test"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    tmpfs: ["/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
  mock-agent:
    build: .
    command: ["uvicorn", "app.testing.mock_agent:app", "--host", "0.0.0.0", "--port", "9000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 2s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://agora_test:agora_test_password@postgres:5432/agora_test
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 20
  backtest-worker:
    build: .
    command: ["python", "-m", "app.worker.backtest_worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://agora_test:agora_test_password@postgres:5432/agora_test
      REDIS_URL: redis://redis:6379/0
      BACKTEST_CONSUMER_NAME: integration-worker
      BACKTEST_WORKER_STALE_SECONDS: 5
      AGENT_BACKTEST_TIMEOUT_SECONDS: 5
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      mock-agent: {condition: service_healthy}
  integration-tests:
    build: .
    command: ["python", "-m", "app.testing.integration_runner"]
    environment:
      API_URL: http://api:8000
      MOCK_AGENT_URL: http://mock-agent:9000
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api: {condition: service_healthy}
      backtest-worker: {condition: service_started}
      mock-agent: {condition: service_healthy}
